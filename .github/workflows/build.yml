name: Build Fudebako

# Runs on every push to the "release" branch (and on demand from the Actions tab).
# Builds Windows, Linux and Android packages, then publishes them as a GitHub Release
# named after the version in package.json (e.g. v1.0.0).
on:
  workflow_dispatch:
  push:
    branches: [release]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: fudebako-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # The action's default package list includes the legacy "tools" package, which Google
      # has removed from the SDK repository, so list the packages explicitly.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;27.0.12077973'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - run: npm ci
      - name: Build APK (debug-signed, installable)
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          npx tauri android init
          npx tauri android build --apk --debug
      - name: Give the APK a clear name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)" "out/Fudebako_${VERSION}_android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: fudebako-android
          if-no-files-found: error
          path: out/*.apk

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets the job create the tag and the release
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - run: ls -la dist-release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Fudebako ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist-release/*
