[package]
name = "fudebako"
version = "1.0.0"
description = "Fudebako — featherweight click-to-edit markdown editor"
authors = ["Bl∞ming"]
license = "MIT"
edition = "2021"

[lib]
name = "fudebako_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small, fast release binaries
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
